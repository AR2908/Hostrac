<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Guard | HOSTRAC</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Guard Specific Styles handled inside style.css now -->
</head>
<body>

    <!-- TOP NAVBAR FOR GUARD -->
    <div class="top-navbar">
        <div class="logo">HOS<span>TRAC</span></div>
        <div class="user-info">
            <span id="guardName" style="color: #cbd5e1;">Loading...</span>
            <a onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </div>

    <div class="main" style="padding-top: 10px;">
        
        <!-- MOBILE TABS -->
        <div class="mobile-tabs">
            <a class="active" onclick="showPanel('gate', this)"><i class="fas fa-door-open"></i> Gate Control</a>
            <a onclick="showPanel('logs', this)"><i class="fas fa-clipboard-list"></i> Logs</a>
        </div>

        <!-- MAIN GATE PANEL -->
        <div id="panel-gate" class="panel active">
            
            <div class="page-header" style="margin-bottom: 15px;">
                <h1 style="font-size: 20px;">Gate Movement</h1>
            </div>

            <!-- STATS GRID -->
            <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); gap: 10px;">
                <div class="stat-card blue" style="padding: 15px 10px; text-align: center;">
                    <div class="label" style="font-size: 11px;">Approved</div>
                    <div class="value" id="countApproved" style="font-size: 22px;">0</div>
                </div>
                <div class="stat-card red" style="padding: 15px 10px; text-align: center;">
                    <div class="label" style="font-size: 11px;">OUT</div>
                    <div class="value" id="countOut" style="font-size: 22px;">0</div>
                </div>
                <div class="stat-card green" style="padding: 15px 10px; text-align: center;">
                    <div class="label" style="font-size: 11px;">IN</div>
                    <div class="value" id="countIn" style="font-size: 22px;">0</div>
                </div>
            </div>

            <!-- QR SCANNER SECTION -->
            <div class="section" style="border: 2px solid var(--primary); background: #f8faff;">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <h3 style="color: var(--primary); margin: 0; font-size: 16px;"><i class="fas fa-camera"></i> Quick QR Scan</h3>
                    <button id="toggleScanner" class="btn btn-primary" style="padding: 8px 12px; font-size: 12px;" onclick="startScanner()"><i class="fas fa-qrcode"></i> Open Camera</button>
                </div>
                
                <div id="reader" style="width: 100%; max-width: 100%; margin: 0 auto; overflow: hidden; border-radius: 12px; display: none;"></div>
                <div id="scanResult" style="text-align: center; margin-top: 10px; color: var(--success); font-weight: bold; font-size: 14px;"></div>
            </div>

            <!-- AUTHORIZED MOVEMENTS TABLE -->
            <div class="section" style="background: transparent; padding: 0; box-shadow: none; border: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0; font-size: 16px;">Live Gate Records</h3>
                    <button class="btn" style="background: white; border: 1px solid #e2e8f0; padding: 6px 12px; font-size: 12px; color: var(--text-main);" onclick="loadApprovedLeaves()"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Room</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th style="text-align:center;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="guardTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- LOGS PANEL -->
    
    <script src="../js/guard.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
