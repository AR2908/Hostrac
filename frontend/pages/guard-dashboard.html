<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Guard | HOSTRAC</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">
            <div class="logo">HOST<span>RAC</span></div>
            <div class="logo-sub">Security Control</div>
        </div>
        
        <div class="user-badge">
            <div class="name" id="guardName">Loading...</div>
            <div class="role">🛡️ Gate Security</div>
        </div>
        
        <nav>
            <a class="active" onclick="showPanel('gate', this)"><i class="fas fa-door-open icon"></i> <span class="nav-text">Scanner</span></a>
            <a onclick="showPanel('logs', this)"><i class="fas fa-clipboard-list icon"></i> <span class="nav-text">Logs</span></a>
        </nav>
        
        <div class="logout">
            <a onclick="logout()"><i class="fas fa-sign-out-alt icon"></i> <span class="text">Logout</span></a>
        </div>
    </div>

    <div class="main">
        
        <!-- MAIN GATE PANEL -->
        <div id="panel-gate" class="panel active">
            
            <div class="page-header">
                <h1>Gate Control</h1>
                <p>Scan QR codes and monitor movement</p>
            </div>

            <!-- STATS GRID -->
            <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); gap: 15px;">
                <div class="stat-card blue" style="padding: 15px 10px; text-align: center;">
                    <div class="label">Approved</div>
                    <div class="value" id="countApproved" style="font-size: 24px;">0</div>
                </div>
                <div class="stat-card red" style="padding: 15px 10px; text-align: center;">
                    <div class="label">OUT</div>
                    <div class="value" id="countOut" style="font-size: 24px;">0</div>
                </div>
                <div class="stat-card green" style="padding: 15px 10px; text-align: center;">
                    <div class="label">IN</div>
                    <div class="value" id="countIn" style="font-size: 24px;">0</div>
                </div>
            </div>

            <!-- QR SCANNER SECTION -->
            <div class="section" style="border: 2px solid var(--primary); background: #f8faff;">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                    <h3 style="color: var(--primary); margin: 0; font-size: 16px;"><i class="fas fa-camera"></i> Quick Scan</h3>
                    <button id="toggleScanner" class="btn btn-primary" style="padding: 10px 15px; font-size: 13px;" onclick="startScanner()"><i class="fas fa-qrcode"></i> Open Camera</button>
                </div>
                
                <div id="reader" style="width: 100%; max-width: 100%; margin: 0 auto; overflow: hidden; border-radius: 12px; display: none;"></div>
                <div id="scanResult" style="text-align: center; margin-top: 15px; color: var(--success); font-weight: bold; font-size: 15px;"></div>
            </div>

            <!-- AUTHORIZED MOVEMENTS TABLE -->
            <div class="section" style="padding: 20px 0 0 0; border: none; box-shadow: none; background: transparent;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0; font-size: 18px;">Live Gate Records</h3>
                    <button class="btn" style="background: white; border: 1px solid #e2e8f0; padding: 8px 15px; color: var(--text-main);" onclick="loadApprovedLeaves()"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                
                <div class="table-responsive" style="background: white; border-radius: 16px; box-shadow: var(--card-shadow); border: 1px solid #e2e8f0;">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Room</th>
                                <th>Date</th>
                                <th>Status</th>
                        
                            </tr>
                        </thead>
                        <tbody id="guardTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- LOGS PANEL -->
        <div id="panel-logs" class="panel">
            <div class="page-header">
                <h1>Movement Logs</h1>
            </div>
            <div class="section" style="text-align: center; padding: 60px 20px;">
                <i class="fas fa-tools" style="font-size: 45px; color: #cbd5e1; margin-bottom: 20px;"></i>
                <p style="color: var(--text-dim); font-weight: 500; font-size: 16px;">Daily log summary feature coming soon...</p>
            </div>
        </div>
<div id="footer-placeholder"></div>
    </div>

    <script src="../js/guard.js"></script>
    <script src="../js/login.js"></script>
    <!-- ================= EDIT STUDENT MODAL ================= -->
<div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: white; padding: 25px; border-radius: 15px; width: 400px; max-width: 90%; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <h3 style="margin-bottom: 20px; border-bottom: 2px solid #6c63ff; padding-bottom: 10px;">Edit Student Details</h3>
        
        <form id="editStudentForm">
            <input type="hidden" id="editStdId">
            
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; font-size: 13px;">Full Name</label>
                <input type="text" id="editStdName" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px;" required>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; font-size: 13px;">Mobile Number</label>
                <input type="text" id="editStdMobile" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px;" required>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; font-size: 13px;">Room No.</label>
                <input type="text" id="editStdRoom" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px;">
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 25px;">
                <button type="button" onclick="closeEditModal()" style="background: #e2e8f0; color: #475569; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">Cancel</button>
                <button type="button" onclick="submitEditStudent()" style="background: #6c63ff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">Save Changes</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
