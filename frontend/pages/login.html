<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOSTRAC | Secure Login & Admission</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link to new Login CSS -->
    <link rel="stylesheet" href="../style/login.css">
</head>
<body>

    <!-- Premium Animated Particle Background -->
    <canvas id="bgCanvas"></canvas>

    <div class="login-wrapper">
        <div class="glass-card" id="mainCard">
            
            <!-- ================= LOGIN FORM SECTION ================= -->
            <div id="loginSection">
                <div class="login-header">
                    <div class="logo">HOST<span>RAC</span></div>
                    <p>Welcome back! Please sign in to continue.</p>
                </div>

                <form onsubmit="event.preventDefault(); login();" class="login-form">
                    
                    <div class="input-group">
                        <i class="fas fa-user-shield icon"></i>
                        <select id="role" required>
                            <option value="" disabled selected>Select your role...</option>
                            <option value="student">🎓 Student</option>
                            <option value="warden">🏫 Warden</option>
                            <option value="guard">🛡️ Security Guard</option>
                            <option value="admin">⚙️ Admin</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-envelope icon"></i>
                        <input type="email" id="email" placeholder="User ID (Email)" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="btn-main" id="loginBtn">
                        Sign In <i class="fas fa-arrow-right"></i>
                    </button>
                    
                    <!-- Registration Link -->
                    <p style="text-align: center; font-size: 13px; margin-top: 20px;">
                        New Admission? <a href="#" onclick="toggleForms('register')" style="color: var(--primary); font-weight: bold;">Register Here</a>
                    </p>
                </form>
            </div>

            <!-- ================= REGISTRATION FORM SECTION ================= -->
            <div id="registerSection" style="display: none;">
                <div class="login-header" style="margin-bottom: 20px;">
                    <div class="logo" style="font-size: 28px;">New <span>Admission</span></div>
                    <p style="font-size: 12px;">Send approval request to Admin</p>
                </div>

                <form id="registerForm" class="login-form">
                    <!-- Name & College -->
                    <div class="input-group">
                        <i class="fas fa-user icon"></i>
                        <input type="text" id="regName" placeholder="Student Full Name" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-graduation-cap icon"></i>
                        <input type="text" id="regCollege" placeholder="College Name (e.g. SCSIT DAVV)" required>
                    </div>

                    <!-- Parents Details (Grid row) -->
                    <div class="grid-row">
                        <div class="input-group">
                            <i class="fas fa-male icon"></i>
                            <input type="text" id="regFather" placeholder="Father's Name" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-female icon"></i>
                            <input type="text" id="regMother" placeholder="Mother's Name" required>
                        </div>
                    </div>

                    <!-- Address & Email -->
                    <div class="input-group">
                        <i class="fas fa-map-marker-alt icon" style="top: 18px; transform: none;"></i>
                        <textarea id="regAddress" placeholder="Full Permanent Address" rows="2" required></textarea>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-envelope icon"></i>
                        <input type="email" id="regEmail" placeholder="Email Address" required>
                    </div>

                    <!-- Passwords -->
                    <div class="grid-row">
                        <div class="input-group">
                            <i class="fas fa-lock icon"></i>
                            <input type="password" id="regPassword" placeholder="Create Password" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-check-circle icon"></i>
                            <input type="password" id="regConfirm" placeholder="Confirm Password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-main" style="margin-top: 10px;">
                        Submit Request <i class="fas fa-paper-plane"></i>
                    </button>
                    
                    <p style="text-align: center; font-size: 13px; margin-top: 15px;">
                        Already approved? <a href="#" onclick="toggleForms('login')" style="color: var(--primary); font-weight: bold;">Login Here</a>
                    </p>
                </form>
            </div>

            <!-- Footer (Dono me dikhega) -->
            <div class="login-footer">
                <a href="../index.html"><i class="fas fa-home"></i> Back to Home Page</a>
            </div>

        </div>
    </div>

    <!-- Login JS -->
    <script src="../js/login.js"></script>
    
    <!-- Small inline script to adjust card size on toggle -->
    <script>
        function toggleForms(type) {
            const loginSec = document.getElementById('loginSection'); 
            const regSec = document.getElementById('registerSection');
            const card = document.getElementById('mainCard');
            
            if(type === 'register') {
                if(loginSec) loginSec.style.display = 'none';
                if(regSec) regSec.style.display = 'block';
                card.style.maxWidth = '600px'; // Make card wider for registration
            } else {
                if(loginSec) loginSec.style.display = 'block';
                if(regSec) regSec.style.display = 'none';
                card.style.maxWidth = '420px'; // Normal width for login
            }
        }
    </script>
</body>
</html>
