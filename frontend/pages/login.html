<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOSTRAC | Secure Login</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link to new Login CSS -->
    <link rel="stylesheet" href="../style/login.css">
</head>
<body>

    <!-- Premium Animated Particle Background -->
    <canvas id="bgCanvas"></canvas>

    <div class="login-wrapper">
        <div class="glass-card">
            
            <div class="login-header">
                <div class="logo">HOST<span>RAC</span></div>
                <p>Welcome back! Please sign in to continue.</p>
            </div>

            <!-- Login Form (Logic untouched) -->
            <form onsubmit="event.preventDefault(); login();" class="login-form">
                
                <div class="input-group">
                    <i class="fas fa-user-shield icon"></i>
                    <select id="role" required>
                        <option value="" disabled selected>Select your role...</option>
                       <option value="student">🎓 Student</option>
                    <option value="warden">🏫 Warden</option>
                    <option value="guard">🛡️ Security Guard</option>
                    <option value="admin">⚙️ Admin</option>
                    </select>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope icon"></i>
                    <input type="email" id="email" placeholder="User ID (Email)" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-main" id="loginBtn">
                    Sign In <i class="fas fa-arrow-right"></i>
                </button>

            </form>

            <div class="login-footer">
                <a href="../index.html"><i class="fas fa-home"></i> Back to Home Page</a>
            </div>

        </div>
    </div>

    <!-- Naya Login JS Jisme Particles aur API dono hain -->
    <script src="../js/login.js"></script>
</body>
</html>
