<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOSTRAC | Secure Login</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link to new Login CSS -->
    <link rel="stylesheet" href="../style/login.css">
</head>
<body>

    <!-- Premium Animated Particle Background -->
    <canvas id="bgCanvas"></canvas>

    <div class="login-wrapper">
        <div class="glass-card">
            
            <div class="login-header">
                <div class="logo">HOST<span>RAC</span></div>
                <p>Welcome back! Please sign in to continue.</p>
            </div>

            <!-- Login Form (Logic untouched) -->
            <form onsubmit="event.preventDefault(); login();" class="login-form">
                
                <div class="input-group">
                    <i class="fas fa-user-shield icon"></i>
                    <select id="role" required>
                        <option value="" disabled selected>Select your role...</option>
                       <option value="student">🎓 Student</option>
                    <option value="warden">🏫 Warden</option>
                    <option value="guard">🛡️ Security Guard</option>
                    <option value="admin">⚙️ Admin</option>
                    </select>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope icon"></i>
                    <input type="email" id="email" placeholder="User ID (Email)" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-main" id="loginBtn">
                    Sign In <i class="fas fa-arrow-right"></i>
                </button>

            </form>
            <!-- ================= REGISTRATION FORM ================= -->
<div id="registerSection" style="display: none;">
    <div class="page-header" style="text-align: center; margin-bottom: 20px;">
        <h2>New Admission</h2>
        <p style="font-size: 12px; color: var(--text-dim);">Fill details to send approval request to Admin</p>
    </div>

    <form id="registerForm" class="grid-form">
        <!-- Name & College -->
        <div class="input-group" style="grid-column: 1 / -1;">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Enter full name" required>
        </div>
        <div class="input-group" style="grid-column: 1 / -1;">
            <label>College Name</label>
            <input type="text" id="regCollege" placeholder="E.g., SCSIT DAVV" required>
        </div>

        <!-- Parents Details (2 in a row) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; grid-column: 1 / -1;">
            <div class="input-group">
                <label>Father's Name</label>
                <input type="text" id="regFather" placeholder="Father's name" required>
            </div>
            <div class="input-group">
                <label>Mother's Name</label>
                <input type="text" id="regMother" placeholder="Mother's name" required>
            </div>
        </div>

        <!-- Address -->
        <div class="input-group" style="grid-column: 1 / -1;">
            <label>Permanent Address</label>
            <textarea id="regAddress" placeholder="Full permanent address" rows="2" required></textarea>
        </div>

        <!-- Email -->
        <div class="input-group" style="grid-column: 1 / -1;">
            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="student@example.com" required>
        </div>

        <!-- Passwords (2 in a row) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; grid-column: 1 / -1;">
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Create password" required>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="regConfirm" placeholder="Confirm password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; grid-column: 1 / -1; padding: 12px; margin-top: 10px;">
            Submit Request <i class="fas fa-paper-plane" style="margin-left: 5px;"></i>
        </button>
        
        <p style="text-align: center; grid-column: 1 / -1; font-size: 13px; margin-top: 15px;">
            Already approved? <a href="#" onclick="toggleForms('login')" style="color: var(--primary); font-weight: bold;">Login Here</a>
        </p>
    </form>
</div>

            <div class="login-footer">
                <a href="../index.html"><i class="fas fa-home"></i> Back to Home Page</a>
            </div>

        </div>
    </div>

    <!-- Naya Login JS Jisme Particles aur API dono hain -->
    <script src="../js/login.js"></script>
</body>
</html>
